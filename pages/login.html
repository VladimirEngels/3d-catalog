<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в 3D-Каталог</title>
    <link rel="stylesheet" href="/src/shared/styles/tokens.css" />
    <link rel="stylesheet" href="/src/shared/styles/base.css" />
    <link rel="stylesheet" href="/src/modules/accounts/accounts.css" />
</head>
<body>
    <main class="auth">
        <section class="auth-card">
            <div class="logo-big">3D-Каталог</div>
            <h1>Вход</h1>

            <form class="auth-form">
                <label for="email">Почта</label>
                <input id="email" name="email" type="email" required />

                <label for="password">Пароль</label>
                <input id="password" name="password" type="password" required />

                <button type="submit" class="btn btn-primary">Войти</button>
            </form>

            <p class="stub-note">Заглушка: пароль пока не проверяется, подойдёт любой</p>
            <a href="/">На главную</a>
        </section>
    </main>

    <script type="module" src="/src/modules/accounts/pages/login.ts"></script>
</body>
</html>
